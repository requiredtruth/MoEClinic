[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moeclinic"
version = "0.1.0"
description = "CPU-only post-hoc diagnostics for mixture-of-experts router traces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RequiredTruth" }]
keywords = ["mixture-of-experts", "moe", "router", "collapse", "local-ai"]

[project.scripts]
moeclinic = "moeclinic.cli:main"

[tool.setuptools.packages.find]
include = ["moeclinic*"]
